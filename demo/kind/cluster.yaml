kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: obs-demo
networking:
  apiServerAddress: "127.0.0.1"
  # No fixed apiServerPort: kind picks a free one, so this never clashes with
  # another kind cluster or Docker Desktop Kubernetes (both use 6443).
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Grafana
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # Alertmanager
      - containerPort: 30903
        hostPort: 9093
        protocol: TCP
      # Prometheus
      - containerPort: 30900
        hostPort: 9090
        protocol: TCP
      # MLflow — host port 5000 collides with macOS AirPlay Receiver, use 5001
      - containerPort: 30500
        hostPort: 5001
        protocol: TCP
      # MinIO console
      - containerPort: 30901
        hostPort: 9001
        protocol: TCP
      # MinIO S3 API
      - containerPort: 30902
        hostPort: 9000
        protocol: TCP
      # OTel OTLP grpc (for sending test traces from host)
      - containerPort: 30317
        hostPort: 4317
        protocol: TCP
      # OTel OTLP http
      - containerPort: 30318
        hostPort: 4318
        protocol: TCP
  - role: worker
  - role: worker
