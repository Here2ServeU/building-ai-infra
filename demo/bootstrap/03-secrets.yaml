# Demo-only secrets. Never use these credentials anywhere else.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: observability
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: mlops
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://minio.storage.svc:9000
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-postgres
  namespace: mlops
type: Opaque
stringData:
  username: mlflow
  password: mlflow
  host: postgres.storage.svc
  port: "5432"
  database: mlflow
