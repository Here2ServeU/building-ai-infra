# Tiny webhook receiver. Alertmanager routes critical/warning here so you can show
# the routing tree firing in real time without a real PagerDuty endpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-viewer-code
  namespace: observability
data:
  app.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from collections import deque

    HISTORY = deque(maxlen=100)

    class H(BaseHTTPRequestHandler):
        def log_message(self, *a, **kw): pass
        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(n)
            try:
                payload = json.loads(body)
                for alert in payload.get("alerts", []):
                    HISTORY.appendleft({
                        "route": self.path.lstrip("/"),
                        "status": alert.get("status"),
                        "alertname": alert.get("labels", {}).get("alertname"),
                        "severity": alert.get("labels", {}).get("severity"),
                        "summary": alert.get("annotations", {}).get("summary"),
                        "starts_at": alert.get("startsAt"),
                    })
            except Exception:
                pass
            self.send_response(200); self.end_headers()

        def do_GET(self):
            self.send_response(200)
            self.send_header("Content-Type", "text/html")
            self.end_headers()
            rows = "".join(
                f"<tr><td>{a['route']}</td><td>{a['severity']}</td><td>{a['alertname']}</td><td>{a['status']}</td><td>{a['summary'] or ''}</td></tr>"
                for a in HISTORY
            )
            self.wfile.write(f"""<html><head><title>Alert Viewer</title>
            <meta http-equiv="refresh" content="3">
            <style>body{{font-family:monospace;padding:20px}}table{{border-collapse:collapse}}td,th{{padding:6px 12px;border:1px solid #ccc}}</style>
            </head><body><h2>Alert Viewer (last 100)</h2>
            <table><tr><th>route</th><th>severity</th><th>name</th><th>status</th><th>summary</th></tr>
            {rows}</table></body></html>""".encode())

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-viewer
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-viewer
    spec:
      containers:
        - name: viewer
          image: python:3.12-slim
          command: ["python", "/code/app.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /code
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: code
          configMap:
            name: alert-viewer-code
---
apiVersion: v1
kind: Service
metadata:
  name: alert-viewer
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: alert-viewer
  ports:
    - port: 8080
      targetPort: 8080
