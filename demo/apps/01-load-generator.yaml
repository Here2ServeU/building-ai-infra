apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: apps
  labels:
    app.kubernetes.io/name: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
    spec:
      containers:
        - name: gen
          image: alpine/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                for i in $(seq 1 50); do
                  curl -s -o /dev/null http://sample-app.apps.svc/ &
                done
                wait
                sleep 1
              done
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
