# doc-classifier served by KServe (Standard mode: plain Deployment + Service).
# A tiny Python predictor stands in for a real model so the demo runs on a laptop CPU.
# It emits the same metrics a real KServe predictor/transformer would
# (inference_requests_total, inference_request_duration_seconds_bucket,
# model_prediction_confidence_*, model_ood_detections_total) on /metrics, so the
# model-serving-RED dashboard and the SLO rules light up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: doc-classifier-code
  namespace: mlops
data:
  app.py: |
    import os, time, random
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from prometheus_client import Counter, Histogram, Summary, generate_latest, CONTENT_TYPE_LATEST

    REQS = Counter("inference_requests_total", "Inference requests", ["model_name", "code"])
    DUR = Histogram("inference_request_duration_seconds", "Inference latency", ["model_name"],
                    buckets=[0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5])
    CONF = Summary("model_prediction_confidence", "Confidence score", ["model_name"])
    OOD = Counter("model_ood_detections_total", "OOD count", ["model_name"])

    MODEL = os.environ.get("MODEL_NAME", "doc-classifier")
    MODEL_VERSION = os.environ.get("MODEL_VERSION", "v1")
    BASE_LATENCY = float(os.environ.get("BASE_LATENCY", "0.04"))

    class H(BaseHTTPRequestHandler):
        def log_message(self, *a, **kw): pass
        def _send(self, status, body, ctype="application/json"):
            self.send_response(status); self.send_header("Content-Type", ctype); self.end_headers()
            self.wfile.write(body)
        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, b"ok", "text/plain")
            if self.path == "/metrics":
                return self._send(200, generate_latest(), CONTENT_TYPE_LATEST)
            if self.path in ("/v1/models/doc-classifier", "/v2/models/doc-classifier"):
                return self._send(200, f'{{"name":"{MODEL}","version":"{MODEL_VERSION}","ready":true}}'.encode())
            self._send(404, b"{}")
        def do_POST(self):
            t0 = time.time()
            time.sleep(BASE_LATENCY + random.uniform(0, 0.03))
            confidence = max(0.5, min(1.0, random.gauss(0.85, 0.07)))
            CONF.labels(MODEL).observe(confidence)
            if confidence < 0.6:
                OOD.labels(MODEL).inc()
            REQS.labels(MODEL, "200").inc()
            DUR.labels(MODEL).observe(time.time() - t0)
            self._send(200, f'{{"prediction":"class_A","confidence":{confidence:.3f},"version":"{MODEL_VERSION}"}}'.encode())

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: doc-classifier
  namespace: mlops
  labels:
    model.regulated: "true"
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    labels:
      app.kubernetes.io/name: doc-classifier
      app.kubernetes.io/component: predictor
    containers:
      - name: kserve-container
        image: python:3.12-slim
        command: ["sh", "-c"]
        args:
          - "pip install --quiet --no-cache-dir prometheus_client && python /code/app.py"
        # Keep MODEL_VERSION at index 1: scenarios/rollback-model.sh patches it by position.
        env:
          - name: MODEL_NAME
            value: doc-classifier
          - name: MODEL_VERSION
            value: v1
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector-gateway-opentelemetry-collector.observability.svc:4317
          - name: OTEL_SERVICE_NAME
            value: doc-classifier
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: ml.model=doc-classifier,ml.stage=Production,deployment.environment=demo,compliance.regulated=true
        ports:
          - name: http1
            containerPort: 8080
            protocol: TCP
        volumeMounts:
          - name: code
            mountPath: /code
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
    volumes:
      - name: code
        configMap:
          name: doc-classifier-code
---
# Pod-level scrape so it works whatever ports KServe puts on the Service it generates.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: doc-classifier
  namespace: mlops
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: doc-classifier
  podMetricsEndpoints:
    - port: http1
      path: /metrics
      interval: 15s
---
# Steady background traffic so the model-serving dashboard has data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-load
  namespace: mlops
  labels:
    app.kubernetes.io/name: inference-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-load
    spec:
      containers:
        - name: gen
          image: alpine/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                for i in $(seq 1 5); do
                  curl -s -o /dev/null -X POST -H 'Content-Type: application/json' \
                    -d '{"instances":[[1,2,3,4]]}' \
                    http://doc-classifier-predictor.mlops.svc/v1/models/doc-classifier:predict &
                done
                wait
                sleep 1
              done
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
