# Sample app: emits http_requests_total + http_request_duration_seconds_bucket on :9464
# A toggleable error_rate_pct env var lets the SLO-burn scenario inject 5xx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-code
  namespace: apps
data:
  app.py: |
    import os, time, random, threading
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from prometheus_client import Counter, Histogram, start_http_server, REGISTRY

    REQS = Counter("http_requests_total", "HTTP requests", ["job", "service", "code"])
    DUR = Histogram("http_request_duration_seconds", "HTTP latency", ["job", "service"],
                    buckets=[0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10])

    def error_rate():
        try: return float(os.environ.get("ERROR_RATE_PCT", "0"))
        except: return 0.0

    JOB = "sample-app"
    SVC = "sample-app"

    class H(BaseHTTPRequestHandler):
        def log_message(self, *a, **kw): pass
        def do_GET(self):
            t0 = time.time()
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            if random.random() * 100 < error_rate():
                code = "500"; status = 500; body = b"injected"
            else:
                code = "200"; status = 200; body = b"hello"
                time.sleep(random.uniform(0.005, 0.08))
            REQS.labels(JOB, SVC, code).inc()
            DUR.labels(JOB, SVC).observe(time.time() - t0)
            self.send_response(status); self.end_headers(); self.wfile.write(body)

    if __name__ == "__main__":
        start_http_server(9464)
        HTTPServer(("0.0.0.0", 3000), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: apps
  labels:
    app.kubernetes.io/name: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - "pip install --quiet prometheus_client && python /code/app.py"
          env:
            - name: ERROR_RATE_PCT
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-gateway-opentelemetry-collector.observability.svc:4317
            - name: OTEL_SERVICE_NAME
              value: sample-app
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          volumeMounts:
            - name: code
              mountPath: /code
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: code
          configMap:
            name: sample-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: apps
  labels:
    app.kubernetes.io/name: sample-app
spec:
  selector:
    app.kubernetes.io/name: sample-app
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-app
  namespace: apps
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
