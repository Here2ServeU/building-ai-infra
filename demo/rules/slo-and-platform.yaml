apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-slo
  namespace: observability
  labels:
    release: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: api-availability-slo
      interval: 30s
      rules:
        - alert: APIErrorBudgetBurnFast
          expr: |
            (
              sum(rate(http_requests_total{job="sample-app",code=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="sample-app"}[5m]))
            ) > (14.4 * (1 - 0.999))
          for: 2m
          labels:
            severity: critical
            slo: api-availability
          annotations:
            summary: "Fast burn on API availability SLO"
            description: "5xx rate is burning the 30-day error budget at 14.4x — < 2 days to exhaustion."
            runbook_url: "https://runbooks.${BASE_DOMAIN}/api-error-budget"

        - alert: APIErrorBudgetBurnSlow
          expr: |
            (
              sum(rate(http_requests_total{job="sample-app",code=~"5.."}[1h]))
              /
              sum(rate(http_requests_total{job="sample-app"}[1h]))
            ) > (3 * (1 - 0.999))
          for: 15m
          labels:
            severity: warning
            slo: api-availability
          annotations:
            summary: "Slow burn on API availability SLO"

        - alert: APILatencyP99High
          expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job="sample-app"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p99 latency > 1s for 10m"

    - name: kubernetes-platform
      interval: 30s
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} not ready"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} crash-looping"

        - alert: PVCNearFull
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} > 85% full"

    - name: observability-stack-self
      interval: 30s
      rules:
        - alert: OTelCollectorDropping
          expr: rate(otelcol_processor_dropped_log_records[5m]) > 0 or rate(otelcol_processor_dropped_metric_points[5m]) > 0 or rate(otelcol_processor_dropped_spans[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector dropping telemetry"
            description: "Check memory_limiter, sending_queue saturation, or downstream HEC/Prom backpressure."

        - alert: OTelCollectorExportFailing
          expr: rate(otelcol_exporter_send_failed_log_records[5m]) > 0 or rate(otelcol_exporter_send_failed_spans[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OTel Collector export failing"

        - alert: PrometheusTSDBCompactionsFailing
          expr: increase(prometheus_tsdb_compactions_failed_total[1h]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus TSDB compactions failing"

        - alert: AlertmanagerNotificationFailing
          expr: rate(alertmanager_notifications_failed_total[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager notification dispatch failing"

    - name: log-volume-cost-control
      interval: 60s
      rules:
        - alert: SplunkHECIngestSpike
          expr: sum(rate(otelcol_exporter_sent_log_records{exporter="splunk_hec/logs"}[10m])) > 1.5 * sum(rate(otelcol_exporter_sent_log_records{exporter="splunk_hec/logs"}[1h] offset 1d))
          for: 30m
          labels:
            severity: warning
            cost: log-volume
          annotations:
            summary: "Splunk log ingest > 1.5x same-time-yesterday for 30m"
            description: "Investigate noisy source before TB/day budget overruns."
