replicaCount: 1

# The chart's schema has no nodePort field; 'make mlflow' pins the NodePort to 30500
# (http://localhost:5001) right after install.
service:
  type: NodePort
  port: 5000

# MLflow 3.x rejects requests whose Host header it doesn't recognize.
# Allow the browser (localhost:5001) and in-cluster callers (the seed job).
serverAllowedHosts:
  - localhost
  - "localhost:*"
  - 127.0.0.1
  - "127.0.0.1:*"
  - mlflow
  - "mlflow:*"
  - mlflow.mlops
  - "mlflow.mlops:*"
  - mlflow.mlops.svc
  - "mlflow.mlops.svc:*"
  - mlflow.mlops.svc.cluster.local
  - "mlflow.mlops.svc.cluster.local:*"

backendStore:
  # Off: the check's init image is not needed (Postgres is already up) and avoids an extra pull.
  databaseConnectionCheck: false
  postgres:
    enabled: true
    host: postgres.storage.svc
    port: 5432
    database: mlflow
    user: mlflow
    password: mlflow

artifactRoot:
  s3:
    enabled: true
    bucket: mlflow-artifacts
    path: mlflow
    awsAccessKeyId: minioadmin
    awsSecretAccessKey: minioadmin

extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: http://minio.storage.svc:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
