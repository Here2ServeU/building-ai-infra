replicaCount: 1

# The chart's schema has no nodePort field; 'make mlflow' pins the NodePort to 30500
# (http://localhost:5001) right after install.
service:
  type: NodePort
  port: 5000

# MLflow 3.x rejects requests whose Host header isn't on this list. That includes
# Kubernetes health checks, which use the pod IP, so a short list makes the pod restart
# forever. "*" is fine for a laptop demo; in production list your real hostnames.
serverAllowedHosts:
  - "*"

# MLflow 3 can take a while to start on a laptop; give the health checks more room.
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6

backendStore:
  # Off: the check's init image is not needed (Postgres is already up) and avoids an extra pull.
  databaseConnectionCheck: false
  postgres:
    enabled: true
    host: postgres.storage.svc
    port: 5432
    database: mlflow
    user: mlflow
    password: mlflow

artifactRoot:
  s3:
    enabled: true
    bucket: mlflow-artifacts
    path: mlflow
    awsAccessKeyId: minioadmin
    awsSecretAccessKey: minioadmin

extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: http://minio.storage.svc:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceMonitor:
  enabled: true
  # The chart defaults to a "monitoring" namespace; this demo runs Prometheus in "observability".
  namespace: observability
  labels:
    release: kube-prometheus-stack

# Chart bug workaround: with serviceMonitor on, MLflow writes Prometheus metrics to
# /mlflow/metrics, but the chart's root filesystem is read-only. Give it a writable dir.
extraVolumes:
  - name: prometheus-metrics
    emptyDir: {}
extraVolumeMounts:
  - name: prometheus-metrics
    mountPath: /mlflow/metrics
