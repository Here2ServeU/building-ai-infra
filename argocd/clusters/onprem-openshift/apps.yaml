# On-prem cluster (Building AI Infrastructure, Parts 6 and 7): same charts as prod-aks,
# ODF/Ceph storage class, internal hostname. Bootstrap: make argocd-bootstrap CLUSTER=onprem-openshift

apiVersion: v1
kind: Namespace
metadata: { name: rag, labels: { pod-security.kubernetes.io/enforce: restricted } }
---
apiVersion: v1
kind: Namespace
metadata: { name: ingest, labels: { pod-security.kubernetes.io/enforce: restricted } }
---
apiVersion: v1
kind: Namespace
metadata: { name: qdrant, labels: { pod-security.kubernetes.io/enforce: restricted } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector-db-onprem
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: rag-platform
  source:
    repoURL: https://github.com/Here2ServeU/building-ai-infra
    targetRevision: main
    path: helm/charts/vector-db
    helm:
      values: |
        replicaCount: 5
        storage:
          size: 500Gi
          storageClass: ocs-storagecluster-ceph-rbd
        resources:
          requests: { cpu: "2", memory: "8Gi" }
          limits:   { cpu: "8", memory: "32Gi" }
  destination: { server: https://kubernetes.default.svc, namespace: qdrant }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-api-onprem
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: rag-api=ghcr.io/here2serveu/rag-api
    argocd-image-updater.argoproj.io/rag-api.update-strategy: semver
    argocd-image-updater.argoproj.io/rag-api.allow-tags: regexp:^v[1-9][0-9]*\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: rag-platform
  source:
    repoURL: https://github.com/Here2ServeU/building-ai-infra
    targetRevision: main
    path: helm/charts/rag-api
    helm:
      values: |
        image: { repository: ghcr.io/here2serveu/rag-api, tag: v1.0.0 }
        autoscaling: { minReplicas: 10, maxReplicas: 60 }
        pdb: { enabled: true, minAvailable: "60%" }
        resources:
          requests: { cpu: 500m, memory: 512Mi }
          limits:   { cpu: "4",  memory: "2Gi" }
        ingress:
          hosts:
            - host: rag-api.apps.onprem.example.internal
              paths: [{ path: /, pathType: Prefix }]
          tls: [{ secretName: rag-api-tls, hosts: [rag-api.apps.onprem.example.internal] }]
  destination: { server: https://kubernetes.default.svc, namespace: rag }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingest-worker-onprem
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: ingest-worker=ghcr.io/here2serveu/ingest-worker
    argocd-image-updater.argoproj.io/ingest-worker.update-strategy: semver
    argocd-image-updater.argoproj.io/ingest-worker.allow-tags: regexp:^v[1-9][0-9]*\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: rag-platform
  source:
    repoURL: https://github.com/Here2ServeU/building-ai-infra
    targetRevision: main
    path: helm/charts/ingest-worker
    helm:
      values: |
        image: { repository: ghcr.io/here2serveu/ingest-worker, tag: v1.0.0 }
        keda:
          minReplicaCount: 3
          maxReplicaCount: 100
  destination: { server: https://kubernetes.default.svc, namespace: ingest }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
