# Building AI Infrastructure, Part 7: "One set of rules, everywhere".
# Starts in Audit so existing workloads surface violations without being blocked.
# Flip validationFailureAction to Enforce per policy once reports are clean.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - require-non-root.yaml
  - disallow-latest-tag.yaml
  - require-requests-limits.yaml
  - require-cost-labels.yaml
